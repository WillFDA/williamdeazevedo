<!doctype html>
<html lang="fr">
  <meta charset="utf-8" />
  <title>Couverture : arborescence de site web</title>
  <style>
    @font-face {
      font-family: Geist;
      src: url("../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2")
        format("woff2");
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
      margin: 0;
    }
    html,
    body {
      width: 1600px;
      height: 900px;
      overflow: hidden;
    }
    body {
      background: #e8ecef;
      font-family: Geist, Inter, system-ui, sans-serif;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 330px;
      height: 620px;
      background: #fff;
      border-radius: 28px;
      padding: 13px 13px 0;
      box-shadow:
        0 18px 40px rgba(17, 24, 39, 0.08),
        0 2px 6px rgba(17, 24, 39, 0.04);
    }
    .panel {
      position: relative;
      height: 470px;
      background: #f3f4f6;
      border-radius: 20px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 26px 4px 0;
    }
    .legend .icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.08);
    }
    .legend h2 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .legend p {
      font-size: 20px;
      color: #6b7280;
      padding: 8px 4px 0;
      letter-spacing: -0.005em;
    }
    .blue {
      background: linear-gradient(180deg, #4b8cff, #2d6cf0);
    }
    .pink {
      background: linear-gradient(180deg, #f25aa7, #e8368d);
    }
    .green {
      background: linear-gradient(180deg, #34c764, #1eb253);
    }
    .purple {
      background: linear-gradient(180deg, #9d6cff, #8653f5);
    }

    /* boîtes génériques */
    .box {
      background: #fff;
      border: 1px solid #e3e6eb;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #1f2937;
      line-height: 1;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04);
    }

    /* 1. Lister */
    .list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .list .box {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 40px;
      padding: 0 12px;
    }
    .check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #dcf5e6;
      display: grid;
      place-items: center;
      flex: none;
    }

    /* 2. Regrouper */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 42px;
      padding: 0 12px;
      font-size: 13px;
    }
    .nav span {
      position: relative;
      padding: 4px 0;
    }
    .nav .active {
      color: #2563eb;
    }
    .nav .active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 2px;
      background: #2563eb;
      border-radius: 1px;
    }
    .dropdown {
      margin: 10px 0 0 12px;
      width: 190px;
      padding: 8px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #e3e6eb;
      box-shadow: 0 10px 24px rgba(17, 24, 39, 0.08);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dropdown span {
      display: block;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }
    .dropdown span:first-child {
      background: #eef3ff;
      color: #1d4ed8;
      font-weight: 600;
    }
    .caret {
      width: 0;
      height: 0;
      border: 7px solid transparent;
      border-bottom-color: #fff;
      margin: 6px 0 -13px 58px;
      position: relative;
      z-index: 1;
    }

    /* 3 & 4 : arbres en SVG */
    svg {
      display: block;
      overflow: visible;
    }
    svg text {
      font-family: Geist, Inter, system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #1f2937;
      text-anchor: middle;
      dominant-baseline: central;
    }
    svg .node {
      fill: #fff;
      stroke: #e3e6eb;
    }
    svg .root {
      fill: url(#rootfill);
      stroke: none;
    }
    svg .root-text {
      fill: #fff;
    }
    svg .edge {
      fill: none;
      stroke: #c3c9d3;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    svg .pill {
      fill: #e4ecff;
    }
    svg .pill-text {
      fill: #1d4ed8;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
  <body>
    <section class="card">
      <div class="panel">
        <div class="list">
          <div class="box">
            <span class="check"
              ><svg width="12" height="10" viewBox="0 0 12 10">
                <path
                  d="M1.5 5.2 4.6 8.3 10.5 1.8"
                  fill="none"
                  stroke="#16a34a"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                /></svg></span
            >Accueil
          </div>
          <div class="box">
            <span class="check"
              ><svg width="12" height="10" viewBox="0 0 12 10">
                <path
                  d="M1.5 5.2 4.6 8.3 10.5 1.8"
                  fill="none"
                  stroke="#16a34a"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                /></svg></span
            >Services
          </div>
          <div class="box">
            <span class="check"
              ><svg width="12" height="10" viewBox="0 0 12 10">
                <path
                  d="M1.5 5.2 4.6 8.3 10.5 1.8"
                  fill="none"
                  stroke="#16a34a"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                /></svg></span
            >Réalisations
          </div>
          <div class="box">
            <span class="check"
              ><svg width="12" height="10" viewBox="0 0 12 10">
                <path
                  d="M1.5 5.2 4.6 8.3 10.5 1.8"
                  fill="none"
                  stroke="#16a34a"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                /></svg></span
            >À propos
          </div>
          <div class="box">
            <span class="check"
              ><svg width="12" height="10" viewBox="0 0 12 10">
                <path
                  d="M1.5 5.2 4.6 8.3 10.5 1.8"
                  fill="none"
                  stroke="#16a34a"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                /></svg></span
            >Contact
          </div>
          <div class="box">
            <span class="check"
              ><svg width="12" height="10" viewBox="0 0 12 10">
                <path
                  d="M1.5 5.2 4.6 8.3 10.5 1.8"
                  fill="none"
                  stroke="#16a34a"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                /></svg></span
            >Mentions légales
          </div>
        </div>
      </div>
      <div class="legend">
        <span class="icon blue"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M7 5h9M7 10h9M7 15h9" />
            <circle cx="3.5" cy="5" r="1" fill="#fff" stroke="none" />
            <circle cx="3.5" cy="10" r="1" fill="#fff" stroke="none" />
            <circle cx="3.5" cy="15" r="1" fill="#fff" stroke="none" /></svg
        ></span>
        <h2>Lister</h2>
      </div>
      <p class="legend">Ce que cherchent vos clients</p>
    </section>

    <section class="card">
      <div class="panel">
        <div class="box nav">
          <span>Accueil</span><span class="active">Services</span
          ><span>Réalisations</span><span>Contact</span>
        </div>
        <div class="caret"></div>
        <div class="dropdown">
          <span>Dépannage</span><span>Installation</span><span>Rénovation</span>
        </div>
      </div>
      <div class="legend">
        <span class="icon pink"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="14" height="6" rx="1.5" />
            <rect x="3" y="11" width="14" height="6" rx="1.5" /></svg
        ></span>
        <h2>Regrouper</h2>
      </div>
      <p class="legend">Un menu court et clair</p>
    </section>

    <section class="card">
      <div class="panel">
        <svg width="268" height="300" viewBox="0 0 268 300">
          <defs>
            <linearGradient id="rootfill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4b8cff" />
              <stop offset="1" stop-color="#2d6cf0" />
            </linearGradient>
          </defs>
          <!-- Accueil -> 3 enfants : tronc, barre horizontale, 3 descentes -->
          <path
            class="edge"
            d="M134 34v16M38 50h192M38 50v18M134 50v18M230 50v18"
          />
          <!-- Services -> 3 sous-pages : coude unique, 3 branches -->
          <path class="edge" d="M38 102v172M38 150h22M38 212h22M38 274h22" />
          <rect class="root" x="86" y="0" width="96" height="34" rx="9" />
          <text class="root-text" x="134" y="17">Accueil</text>
          <rect class="node" x="0" y="68" width="76" height="34" rx="9" />
          <text x="38" y="85">Services</text>
          <rect class="node" x="86" y="68" width="96" height="34" rx="9" />
          <text x="134" y="85">Réalisations</text>
          <rect class="node" x="192" y="68" width="76" height="34" rx="9" />
          <text x="230" y="85">Contact</text>
          <rect class="node" x="60" y="133" width="112" height="34" rx="9" />
          <text x="116" y="150">Dépannage</text>
          <rect class="node" x="60" y="195" width="112" height="34" rx="9" />
          <text x="116" y="212">Installation</text>
          <rect class="node" x="60" y="257" width="112" height="34" rx="9" />
          <text x="116" y="274">Rénovation</text>
        </svg>
      </div>
      <div class="legend">
        <span class="icon green"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="10" cy="4" r="2" />
            <circle cx="4" cy="16" r="2" />
            <circle cx="16" cy="16" r="2" />
            <path d="M10 6v4M10 10l-6 4M10 10l6 4" /></svg
        ></span>
        <h2>Organiser</h2>
      </div>
      <p class="legend">Une page par service</p>
    </section>

    <section class="card">
      <div class="panel">
        <svg width="268" height="300" viewBox="0 0 268 300">
          <!-- une seule colonne : la ligne passe derrière les pastilles, jamais sous le texte -->
          <path class="edge" d="M134 34v99M134 167v99" />
          <rect class="root" x="86" y="0" width="96" height="34" rx="9" />
          <text class="root-text" x="134" y="17">Accueil</text>
          <rect class="pill" x="108" y="72" width="52" height="24" rx="12" />
          <text class="pill-text" x="134" y="84">1 clic</text>
          <rect class="node" x="86" y="133" width="96" height="34" rx="9" />
          <text x="134" y="150">Services</text>
          <rect class="pill" x="104" y="205" width="60" height="24" rx="12" />
          <text class="pill-text" x="134" y="217">2 clics</text>
          <rect class="node" x="78" y="266" width="112" height="34" rx="9" />
          <text x="134" y="283">Dépannage</text>
        </svg>
      </div>
      <div class="legend">
        <span class="icon purple"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            stroke="#fff"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 10.5l4 4 8-9" /></svg
        ></span>
        <h2>Vérifier</h2>
      </div>
      <p class="legend">Tout à 3 clics au plus</p>
    </section>
  </body>
</html>
