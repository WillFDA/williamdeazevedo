name: CI

on:
  pull_request:
  push:
    branches: ["2026"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled; every push to 2026 is validated.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      # oxlint/oxfmt load their TypeScript configs natively: Node >= 22.18 required.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check:repo
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run check:editorial
      # e2e/ : consentement, menu, Cal.com, redirections (wrangler) et axe.
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:e2e
