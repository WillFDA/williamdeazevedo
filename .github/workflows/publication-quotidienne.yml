# Publication des articles programmés.
# Un article n'a de page qu'une fois sa `pubDate` atteinte, au moment du build
# (voir src/lib/articles.ts). Sans nouveau commit, rien ne relance le build :
# ce workflow déclenche chaque matin le déploiement de production via un
# « deploy hook » Cloudflare Workers Builds.
#
# À configurer une fois (hors code) : créer le deploy hook sur la branche 2026
# dans Cloudflare (Workers & Pages > projet > Settings > Builds > Deploy Hooks,
# https://developers.cloudflare.com/workers/ci-cd/builds/deploy-hooks/), puis
# enregistrer son URL dans le secret GitHub CLOUDFLARE_DEPLOY_HOOK_URL.
# Tant que le secret est absent, le workflow s'arrête sans échec mais avec un
# avertissement visible dans l'onglet Actions.
#
# GitHub n'exécute les `schedule` que depuis la branche par défaut du dépôt
# (aujourd'hui `develop`) : ce fichier doit aussi y être, ou la branche par
# défaut passer à `2026`. Le déclenchement manuel marche depuis n'importe
# quelle branche. Sur un dépôt public, GitHub désactive les `schedule` après
# 60 jours sans activité : les commits d'articles suffisent, sinon le
# réactiver dans l'onglet Actions.
name: Publication quotidienne

on:
  schedule:
    # 05:17 UTC, soit vers 6 h ou 7 h à Paris selon l'heure d'été. Minute
    # décalée : à l'heure pile, GitHub retarde ou saute souvent les cron.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publication-quotidienne
  cancel-in-progress: false

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Déclencher le build de production
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secret CLOUDFLARE_DEPLOY_HOOK_URL absent : aucun build déclenché, les articles programmés ne seront pas publiés."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 2 --retry-delay 10 \
            -X POST "$DEPLOY_HOOK_URL" > /dev/null
          echo "Build de production demandé."
